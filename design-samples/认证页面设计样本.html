<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认证页面设计样本 — 登录 · 注册 · 忘记密码 · 重置密码</title>
<style>
:root {
  --ds-accent: #C15F3C; --ds-accent-hover: #D47A4E;
  --ds-accent-subtle: rgba(193,95,60,0.08);
  --ds-page-bg: #FAF9F5; --ds-surface: #FFFFFF;
  --ds-surface-subtle: #F5F2EC; --ds-surface-inset: #F0EDE6;
  --ds-border: #E8E3DA; --ds-border-muted: #EEE9E2; --ds-border-strong: #D9D2C7;
  --ds-text: #3B3228; --ds-text-secondary: #7A6E62; --ds-text-tertiary: #A0958B;
  --ds-text-inverse: #FFFFFF;
  --ds-success: #4A8B5C; --ds-danger: #C8483C; --ds-warning: #B8862D;
  --ds-danger-subtle: rgba(200,72,60,0.08);
  --ds-success-subtle: rgba(74,139,92,0.10);
  --ds-radius-sm: 6px; --ds-radius-md: 10px; --ds-radius-lg: 14px;
  --ds-shadow-sm: 0 1px 3px rgba(59,50,40,0.04);
  --ds-space-1:4px; --ds-space-2:8px; --ds-space-3:12px;
  --ds-space-4:16px; --ds-space-5:20px; --ds-space-6:24px;
  --font-display: 'Georgia','Noto Serif SC',serif;
  --font-body: 'Charter','Georgia','Noto Serif SC',serif;
  --font-ui: system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono: 'JetBrains Mono','Fira Code',monospace;
}
.dark {
  --ds-page-bg:#1E1B18; --ds-surface:#272420;
  --ds-surface-subtle:#2F2B27; --ds-surface-inset:#1A1714;
  --ds-border:#3A3530; --ds-border-muted:#332F2B; --ds-border-strong:#4A4540;
  --ds-text:#E8E0D8; --ds-text-secondary:#A0988E; --ds-text-tertiary:#706860;
  --ds-accent:#D47A4E; --ds-accent-hover:#E08C64;
  --ds-accent-subtle:rgba(193,95,60,0.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--ds-page-bg);color:var(--ds-text);
  line-height:1.6;padding:32px 24px}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px}
.topbar h1{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ds-text)}
.topbar p{font-size:14px;color:var(--ds-text-secondary);margin-top:4px}
.theme-btn{padding:8px 16px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-sm);
  background:var(--ds-surface);color:var(--ds-text-secondary);cursor:pointer;
  font-family:var(--font-ui);font-size:13px;font-weight:600;transition:all .2s}
.theme-btn:hover{border-color:var(--ds-accent);color:var(--ds-accent)}

.section-title{font-family:var(--font-display);font-size:18px;font-weight:700;
  color:var(--ds-text);margin-bottom:20px;padding-bottom:12px;
  border-bottom:1px solid var(--ds-border-muted)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:40px}

/* Auth card */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:500px;
  background:var(--ds-page-bg);border:1px solid var(--ds-border);border-radius:var(--ds-radius-sm)}
.auth-card{width:440px;background:var(--ds-surface);border:1px solid var(--ds-border);
  border-radius:var(--ds-radius-md);padding:36px 32px}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.auth-logo svg{width:28px;height:28px;color:var(--ds-accent)}
.auth-logo span{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ds-text)}
.auth-title{font-family:var(--font-display);font-size:20px;font-weight:700;
  color:var(--ds-text);text-align:center;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:var(--ds-text-secondary);text-align:center;margin-bottom:24px}
.auth-subtitle a{color:var(--ds-accent);text-decoration:none;font-weight:600}
.auth-subtitle a:hover{text-decoration:underline}

.form-group{margin-bottom:16px}
.form-label{display:block;font-family:var(--font-ui);font-size:14px;font-weight:600;
  color:var(--ds-text);margin-bottom:6px}
.form-input{padding:10px 12px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-sm);
  background:var(--ds-surface);font-family:var(--font-ui);font-size:14px;color:var(--ds-text);
  outline:none;width:100%;transition:border-color .2s}
.form-input:focus{border-color:var(--ds-accent)}
.form-input::placeholder{color:var(--ds-text-tertiary)}
.form-error{font-size:12px;color:var(--ds-danger);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-ui);font-weight:600;border-radius:var(--ds-radius-sm);
  border:1px solid transparent;cursor:pointer;transition:all .15s;width:100%}
.btn-primary{padding:10px 20px;font-size:14px;background:var(--ds-accent);color:var(--ds-text-inverse)}
.btn-primary:hover{background:var(--ds-accent-hover)}
.btn-secondary{padding:10px 20px;font-size:14px;background:var(--ds-surface);color:var(--ds-text);border-color:var(--ds-border)}
.btn-secondary:hover{background:var(--ds-surface-subtle)}
.btn-link{background:none;border:none;color:var(--ds-accent);font-weight:600;cursor:pointer;font-size:13px;padding:0;width:auto}
.btn-link:hover{text-decoration:underline}

.divider-line{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:var(--ds-border-muted)}
.divider-line span{font-size:12px;color:var(--ds-text-tertiary);font-family:var(--font-ui)}

.auth-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--ds-text-secondary)}
.auth-footer a{color:var(--ds-accent);text-decoration:none;font-weight:600}
.auth-footer a:hover{text-decoration:underline}

/* Code block (6 digit code input) */
.code-inputs{display:flex;gap:8px;justify-content:center;margin:20px 0}
.code-input{width:48px;height:56px;text-align:center;font-family:var(--font-mono);font-size:24px;
  border:1px solid var(--ds-border);border-radius:var(--ds-radius-sm);background:var(--ds-surface);
  color:var(--ds-text);outline:none;transition:border-color .2s}
.code-input:focus{border-color:var(--ds-accent)}

.note{font-size:12px;color:var(--ds-text-tertiary);text-align:center;margin-top:12px}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>认证页面设计样本</h1>
    <p>全屏居中卡片 · ContentLayout type="auth-card" · 宽度 440px</p>
  </div>
  <button class="theme-btn" onclick="document.documentElement.classList.toggle('dark')">☀️ / 🌙 暗色模式</button>
</div>

<!-- Login -->
<div class="grid-2">
  <div>
    <div class="section-title">登录</div>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="22" height="16" rx="2"/><path d="M10 12V8a6 6 0 0 1 12 0v4"/><circle cx="16" cy="20" r="1.5" fill="currentColor" stroke="none"/><line x1="16" y1="22.5" x2="16" y2="25"/></svg>
          <span>ZhiYun</span>
        </div>
        <h2 class="auth-title">欢迎回来</h2>
        <p class="auth-subtitle">还没有账号？<a href="#">立即注册</a></p>

        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" type="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" style="margin-top:8px">登录</button>
        <p class="auth-footer" style="margin-top:16px"><a href="#">忘记密码？</a></p>
      </div>
    </div>
  </div>

  <!-- Register -->
  <div>
    <div class="section-title">注册</div>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="22" height="16" rx="2"/><path d="M10 12V8a6 6 0 0 1 12 0v4"/><circle cx="16" cy="20" r="1.5" fill="currentColor" stroke="none"/><line x1="16" y1="22.5" x2="16" y2="25"/></svg>
          <span>ZhiYun</span>
        </div>
        <h2 class="auth-title">创建账号</h2>
        <p class="auth-subtitle">已有账号？<a href="#">立即登录</a></p>

        <div class="form-group">
          <label class="form-label">用户名</label>
          <input class="form-input" placeholder="你的用户名" />
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" type="password" placeholder="至少 6 个字符" />
        </div>
        <button class="btn btn-primary" style="margin-top:8px">创建账号</button>
      </div>
    </div>
  </div>
</div>

<!-- Forgot + Reset -->
<div class="grid-2">
  <div>
    <div class="section-title">忘记密码</div>
    <div class="auth-page">
      <div class="auth-card">
        <h2 class="auth-title">找回密码</h2>
        <p class="auth-subtitle">输入注册邮箱，我们将发送验证码</p>

        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" placeholder="your@email.com" />
        </div>
        <button class="btn btn-primary" style="margin-top:8px">发送验证码</button>
        <p class="auth-footer" style="margin-top:16px"><a href="#">← 返回登录</a></p>
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">重置密码</div>
    <div class="auth-page">
      <div class="auth-card">
        <h2 class="auth-title">重置密码</h2>
        <p class="auth-subtitle">请检查邮箱中的 6 位验证码</p>

        <div class="code-inputs">
          <input class="code-input" maxlength="1" />
          <input class="code-input" maxlength="1" />
          <input class="code-input" maxlength="1" />
          <input class="code-input" maxlength="1" />
          <input class="code-input" maxlength="1" />
          <input class="code-input" maxlength="1" />
        </div>

        <div class="form-group">
          <label class="form-label">新密码</label>
          <input class="form-input" type="password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input class="form-input" type="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary">重置密码</button>
        <p class="note">未收到邮件？<button class="btn-link">重新发送</button></p>
      </div>
    </div>
  </div>
</div>

</body>
</html>

services:
  # ============================================
  # 主应用 (Next.js)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: my-blog-app:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/github_platform
      - REDIS_URL=redis://redis:6379
      # JWT 密钥 - 生产环境必须通过环境变量或 .env 文件设置！
      # 本地开发使用默认值，生产环境必须更换！
      - JWT_SECRET=${JWT_SECRET:-dev_only_change_in_production_access_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_only_change_in_production_refresh_key}
      # 加密密钥 - 生产环境必须通过环境变量设置！
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_to_a_64_char_hex_string}
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-nextauth-secret-key}
      # MinIO 文件存储
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=github-platform
      - S3_REGION=us-east-1
      # 是否使用 Mock 数据
      - USE_MOCK=${USE_MOCK:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev
    restart: unless-stopped

  # ============================================
  # PostgreSQL 数据库
  # ============================================
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis 缓存和会话存储
  # ============================================
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ============================================
  # MinIO 对象存储 (S3 兼容)
  # ============================================
  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # MinIO Client (用于初始化 bucket)
  # ============================================
  minio-init:
    image: docker.m.daocloud.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/github-platform --ignore-existing;
      mc anonymous set download myminio/github-platform;
      exit 0;
      "

  # ============================================
  # 邮件队列处理器 (可选)
  # ============================================
  # 用于处理异步邮件发送任务
  # 如需启用，取消注释以下内容
  # email-queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   image: my-blog-app:latest
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@db:5432/github_platform
  #     - REDIS_URL=redis://redis:6379
  #     - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_to_a_64_char_hex_string}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   command: npm run queue:email
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
